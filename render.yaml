services:
  - type: web
    name: internscrap-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with your Supabase PostgreSQL connection string, or leave unset to use local SQLite
      - key: CORS_ORIGINS
        value: "*"
      - key: ENABLE_BACKGROUND_SCHEDULER
        value: "true"
      - key: SCHEDULER_INTERVAL_HOURS
        value: "4"
      - key: THREADS_SCAN_INTERVAL_MINUTES
        value: "10"
      - key: ALERT_MIN_MATCH_SCORE
        value: "60"
      - key: RENDER_EXTERNAL_URL
        sync: false # Automatically set by Render, or set to your https://<app>.onrender.com for 24/7 keep-alive
