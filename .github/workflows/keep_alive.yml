name: 24/7 Keep-Alive Monitor

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier idle spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://internscrap-backend.onrender.com"
          fi
          echo "Pinging health endpoint at: $TARGET_URL/api/health"
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s\n" --max-time 15 "$TARGET_URL/api/health" || true)
          echo "$RESPONSE"
